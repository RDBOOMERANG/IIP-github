<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Events - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="brand">CampusHub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <div class="container">
        <h1 id="reg-heading">Event Registration Portal</h1>
        <p>Complete the form below to register your participation for upcoming events.</p>

        <button onclick="changeHeadingSize()">Resize Heading</button>
        <button onclick="toggleForm()">Show/Hide Form</button>

        <form id="registrationForm" onsubmit="handleRegistration(event)" style="margin-top: 20px;">
            <h2>Participant Details</h2>
            
            <label>Student Name:</label>
            <input type="text" id="studentName" placeholder="Enter your full name">

            <label>Student Roll Number:</label>
            <input type="text" id="rollNumber" placeholder="Enter your roll number">

            <label>Email Address:</label>
            <input type="email" id="email" placeholder="Enter your email address">

            <label>Event Selection:</label>
            <select id="eventChoice">
                <option value="">Choose an Event</option>
                <option value="Tech Hackathon">Tech Hackathon</option>
                <option value="RoboWars">RoboWars</option>
                <option value="Art Exhibition">Art Exhibition</option>
                <option value="Inter-College Quiz">Inter-College Quiz</option>
            </select>

            <button type="submit" style="margin-top: 20px;">Submit Registration</button>
        </form>

        <p id="regMessage" style="font-weight: bold; margin-top: 20px;"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
